plugins {
    id "com.android.application"
}

def sdlSource = new File(rootProject.projectDir, ".cache/SDL2").absolutePath
def generatedCode = providers.gradleProperty("jsrfGenDir")
        .getOrElse(new File(projectDir, "../../port/recomp/gen").absolutePath)
def hasGeneratedCode = new File(generatedCode, "recomp_types.h").isFile()

android {
    namespace "org.libsdl.app"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "org.otherbackup.jsrfunleashed"
        minSdk 23
        targetSdk 32
        versionCode 2
        versionName "0.2.0-android"

        buildConfigField "boolean", "JSRF_RUNTIME_AVAILABLE", hasGeneratedCode ? "true" : "false"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DFETCHCONTENT_SOURCE_DIR_SDL2=${sdlSource}",
                          "-DJSRF_GEN_DIR=${generatedCode}",
                          "-DJSRF_BUILD_GAME=${hasGeneratedCode ? 'ON' : 'OFF'}"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../port/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["${sdlSource}/android-project/app/src/main/java"]
        }
    }
}

dependencies {
    implementation "androidx.documentfile:documentfile:1.0.1"
}
